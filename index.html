<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Dopa</title>
<meta name="description" content="Tiny Dopa - Coming Soon.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root { --bg: #FAF6EC; --ink: #060606; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(4px, 1.5vh, 16px);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  .lockup { width: clamp(260px, 62vh, 640px); height: auto; }
  .tagline {
    color: var(--ink); opacity: 0.55;
    font-size: clamp(13px, 1.8vh, 16px);
    letter-spacing: 0.02em;
    text-align: center;
  }
</style>
</head>
<body>
  <img class="lockup" src="lockup-7a.png" alt="Tiny Dopa">
  <p class="tagline">Coming Soon</p>
</body>
</html>
